
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaGuide Animalis</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
color:#222;
}

header{
background:linear-gradient(135deg,#E30000,#253595);
color:white;
padding:25px;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.25);
}

header h1{
font-size:36px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search{
margin-bottom:25px;
}

.search input{
width:100%;
padding:15px;
font-size:18px;
border-radius:12px;
border:1px solid #ccc;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.08);
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-6px);
}

.hero{
height:180px;
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
color:white;
background:linear-gradient(135deg,#0f766e,#2563eb);
}

.info{
padding:18px;
}

.info h3{
margin-bottom:6px;
}

.widgets{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
margin-top:35px;
}

.widget{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.widget input,
.widget select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#E30000;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#b40000;
}

#modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
max-width:600px;
width:100%;
border-radius:20px;
padding:25px;
position:relative;
}

.close{
position:absolute;
top:15px;
right:18px;
font-size:28px;
cursor:pointer;
}

.tag{
display:inline-block;
background:#253595;
color:white;
padding:6px 10px;
border-radius:20px;
font-size:13px;
margin:3px;
}
</style>
</head>

<body>

<header>

<h1>🐟 AquaGuide Animalis</h1>

<p>Guide interactif d'aquariophilie</p>

</header>

<div class="container">

<div class="search">

<input id="search" placeholder="Rechercher une espèce...">

</div>

<div id="catalogue" class="grid"></div>

<div class="widgets">

<div class="widget">

<h2>🧮 Calculateur Aquarium</h2>

<input id="litres" type="number" value="120">

<button onclick="calculer()">Calculer</button>

<p id="resultat" style="margin-top:15px;"></p>

</div>

<div class="widget">

<h2>🤝 Compatibilité</h2>

<select id="fish1"></select>

<select id="fish2"></select>

<button onclick="compatibilite()">Vérifier</button>

<p id="compat" style="margin-top:15px;"></p>

</div>

</div>

</div>

<div id="modal">

<div class="modal-content">

<span class="close" onclick="fermer()">✕</span>

<div id="fiche"></div>

</div>

</div>

<script>

const poissons=[

{
nom:"Gourami perlé",
latin:"Trichopodus leerii",
emoji:"🐠",
volume:"200 L",
temp:"23–28°C",
ph:"6.0–7.5",
taille:"12 cm",
groupe:"5+",
alimentation:"Omnivore",
compat:["Platy","Corydoras Panda"]
},

{
nom:"Guppy",
latin:"Poecilia reticulata",
emoji:"🐟",
volume:"60 L",
temp:"22–28°C",
ph:"7.0–8.2",
taille:"5 cm",
groupe:"6+",
alimentation:"Omnivore",
compat:["Platy","Corydoras Panda"]
},

{
nom:"Platy",
latin:"Xiphophorus maculatus",
emoji:"🐠",
volume:"80 L",
temp:"20–26°C",
ph:"7.0–8.2",
taille:"6 cm",
groupe:"6+",
alimentation:"Omnivore",
compat:["Guppy","Corydoras Panda","Gourami perlé"]
},

{
nom:"Corydoras Panda",
latin:"Corydoras panda",
emoji:"🐡",
volume:"80 L",
temp:"22–26°C",
ph:"6.0–7.5",
taille:"5 cm",
groupe:"6+",
alimentation:"Omnivore",
compat:["Guppy","Platy","Gourami perlé"]
}

];

const catalogue=document.getElementById("catalogue");

function afficher(liste){

catalogue.innerHTML="";

liste.forEach(p=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="hero">${p.emoji}</div>

<div class="info">

<h3>${p.nom}</h3>

<p><em>${p.latin}</em></p>

<p>🌊 ${p.volume}</p>

<p>🌡 ${p.temp}</p>

</div>`;

card.onclick=()=>ouvrir(p);

catalogue.appendChild(card);

});

}

function ouvrir(p){

document.getElementById("modal").style.display="flex";

document.getElementById("fiche").innerHTML=`

<h2>${p.nom}</h2>

<p><em>${p.latin}</em></p>

<hr style="margin:15px 0;">

<p><b>🌊 Volume :</b> ${p.volume}</p>

<p><b>🌡 Température :</b> ${p.temp}</p>

<p><b>💧 pH :</b> ${p.ph}</p>

<p><b>📏 Taille :</b> ${p.taille}</p>

<p><b>👥 Vie en groupe :</b> ${p.groupe}</p>

<p><b>🍽 Alimentation :</b> ${p.alimentation}</p>

<div style="margin-top:15px;">

${p.compat.map(c=>`<span class="tag">${c}</span>`).join("")}

</div>

`;

}

function fermer(){

document.getElementById("modal").style.display="none";

}

afficher(poissons);

document.getElementById("search").oninput=e=>{

const t=e.target.value.toLowerCase();

afficher(poissons.filter(p=>

(p.nom+p.latin).toLowerCase().includes(t)

));

};

const f1=document.getElementById("fish1");
const f2=document.getElementById("fish2");

poissons.forEach(p=>{

f1.innerHTML+=`<option>${p.nom}</option>`;
f2.innerHTML+=`<option>${p.nom}</option>`;

});

function calculer(){

const v=Number(document.getElementById("litres").value);

let txt="";

if(v<60)
txt="Petit aquarium : Betta conseillé.";

else if(v<120)
txt="Idéal pour Guppys et Platys.";

else if(v<200)
txt="Aquarium communautaire avec Corydoras.";

else
txt="Volume adapté aux Gouramis perlés.";

document.getElementById("resultat").innerHTML=txt;

}

calculer();

function compatibilite(){

const a=poissons.find(x=>x.nom===f1.value);

const ok=a.compat.includes(f2.value);

document.getElementById("compat").innerHTML=

ok
?"🟢 Ces deux espèces sont compatibles."
:"🟠 Compatibilité à vérifier.";

}

</script>

</body>
</html>
